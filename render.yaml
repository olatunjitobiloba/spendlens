services:
  - type: web
    name: spendlens-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: KORA_SECRET_KEY
        sync: false
      - key: KORA_PUBLIC_KEY
        sync: false
      - key: KORA_PRO_PRICE_KOBO
        sync: false
      - key: KORA_AMOUNT_UNIT
        sync: false
      - key: KORA_WEBHOOK_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
